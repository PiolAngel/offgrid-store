name: OFFGRID / Calidad

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: offgrid-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validar sintaxis del control de publicación
        run: python3 -m py_compile .github/scripts/verify-release.py
      - name: Configurar Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
