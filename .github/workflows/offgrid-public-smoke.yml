name: OFFGRID / Web pública

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validar URL pública de demostración
        shell: bash
        run: |
          set -euo pipefail
          page="https://offgrid-store-rho.vercel.app"
          code=$(curl --location --silent --show-error --max-time 30 --output /tmp/offgrid.html --write-out '%{http_code}' "$page")
          echo "Inicio HTTP: $code"
          test "$code" = "200"
          grep -q 'OFFGRID' /tmp/offgrid.html
          grep -q 'DEMO' /tmp/offgrid.html
          code=$(curl --location --silent --show-error --max-time 30 --output /tmp/offgrid.json --write-out '%{http_code}' "$page/api/catalog")
          echo "Catálogo HTTP: $code"
          test "$code" = "200"
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/offgrid.json","utf8"));if(d.configured!==true || !Array.isArray(d.products) || d.products.length!==12)process.exit(1);console.log("Catálogo de demostración:",d.products.length,"productos")'
