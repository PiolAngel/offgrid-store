name: OFFGRID / E2E visual

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: offgrid-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Instalar y compilar la BETA
        run: |
          npm ci
          npm run build
      - name: Preparar Playwright (navegadores preinstalados)
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Probar desktop y móvil
        run: |
          node tests/e2e-demo.mjs
          node tests/navigation-regression.mjs
      - name: Adjuntar capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offgrid-browser-capturas
          path: test-artifacts
          if-no-files-found: ignore
